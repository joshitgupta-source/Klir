name: Klir Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Rust Core & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust Cargo Registry & Target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "klir_core -> target"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Assemble Hardened Release APKs (Rust + R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: klir-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/release/app-universal-release.apk